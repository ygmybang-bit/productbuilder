<!doctype html><html lang="my"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f4f1"><title>K-pop သတင်း | K-POP YANGON</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#0a0910;--paper:#f6f4f1;--white:#fff;--muted:#716e77;--line:#dedbe2;--pink:#ff3d87}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans Myanmar",sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(880px,calc(100% - 40px));margin:auto}.header{position:sticky;top:0;z-index:5;border-bottom:1px solid #dedbe2cc;background:#f6f4f1e8;backdrop-filter:blur(15px)}nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 1rem Manrope}.back{padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:white;font-size:.76rem}.article{padding:64px 0}.source{color:var(--pink);font:800 .72rem Manrope;letter-spacing:.08em}.article h1{margin:14px 0 22px;font-size:clamp(1.8rem,5vw,3.4rem);line-height:1.45;letter-spacing:-.035em}.meta{display:flex;gap:10px;margin-bottom:30px;color:var(--muted);font-size:.72rem}.hero{width:100%;max-height:540px;border-radius:24px;object-fit:cover;background:#e5e3e7}.body{margin-top:34px;padding:32px;border:1px solid var(--line);border-radius:22px;background:white}.body h2{margin:0 0 16px;font-size:1rem}.body p{margin:0;color:#45424a;font-size:.94rem;line-height:2}.notice{margin-top:22px;padding:16px 18px;border-left:3px solid var(--pink);color:var(--muted);background:#fff;font-size:.73rem;line-height:1.8}.original{display:inline-flex;margin-top:25px;padding:12px 18px;border-radius:999px;background:var(--ink);color:white;font-size:.76rem;font-weight:700}.state{padding:100px 20px;text-align:center;color:var(--muted)}footer{padding:30px 0 50px;color:var(--muted);font-size:.68rem}@media(max-width:600px){.wrap{width:calc(100% - 24px)}nav{height:64px}.article{padding:42px 0}.hero{border-radius:16px}.body{padding:23px;border-radius:16px}}
</style></head><body><header class="header"><nav class="wrap"><a class="brand" href="/">K-POP YANGON</a><a class="back" href="/news.html">← သတင်းများ</a></nav></header><main class="wrap" id="content"><div class="state">သတင်းကို မြန်မာဘာသာဖြင့် ပြင်ဆင်နေပါသည်…</div></main><footer class="wrap">သတင်းနှင့်ဓာတ်ပုံ အရင်းအမြစ်: NATE Idol24</footer><script>
const content=document.querySelector('#content'),id=Number(new URLSearchParams(location.search).get('id'));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const response=await fetch('/api/nate-news'),data=await response.json(),article=data.articles?.find(item=>item.id===id);if(!response.ok||!article)throw new Error('ဤသတင်းကို ရှာမတွေ့ပါ');document.title=`${article.titleMy||article.title} | K-POP YANGON`;const summary=article.summaryMy||'ဤဓာတ်ပုံသတင်းတွင် သီးခြားအကျဉ်းချုပ် မပါရှိပါ။ မူရင်းသတင်းအရင်းအမြစ်ကို အောက်ပါလင့်ခ်မှ စစ်ဆေးနိုင်ပါသည်။';content.innerHTML=`<article class="article"><span class="source">K-POP NEWS · ${esc(article.source)}</span><h1>${esc(article.titleMy||article.title)}</h1><div class="meta"><span>NATE Idol24 မှ</span><span>•</span><span>မြန်မာဘာသာ အကျဉ်းချုပ်</span></div><img class="hero" src="${esc(article.image)}" alt="" referrerpolicy="no-referrer"><div class="body"><h2>သတင်းအကျဉ်းချုပ်</h2><p>${esc(summary)}</p></div><div class="notice">ဤစာမျက်နှာသည် မူရင်းသတင်း၏ အဓိကအချက်များကို မြန်မာဘာသာဖြင့် အကျဉ်းချုပ်ထားခြင်းဖြစ်သည်။ သတင်းအပြည့်အစုံနှင့် အသေးစိတ်အချက်အလက်များအတွက် မူရင်းမီဒီယာကို ကိုးကားပါ။</div><a class="original" href="${esc(article.url)}" target="_blank" rel="noopener">မူရင်းသတင်းကို ကိုးကားရန် ↗</a></article>`}catch(error){content.innerHTML=`<div class="state">${esc(error.message)}<br><br><a href="/news.html">သတင်းစာမျက်နှာသို့ ပြန်သွားရန်</a></div>`}}load();
</script></body></html>
