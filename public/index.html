<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0c"><title>Melon TOP100 — K-POP YANGON</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--g:#00d344;--ink:#0b0d0c;--paper:#f4f6f3;--muted:#747976;--line:#dce1dd}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR",sans-serif}.wrap{width:min(1180px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}button,input{font:inherit}header{position:sticky;top:0;z-index:10;border-bottom:1px solid #dde2decc;background:#f4f6f3e8;backdrop-filter:blur(16px)}nav{height:72px;display:flex;align-items:center}.brand{display:flex;align-items:center;gap:10px;font:800 1rem Manrope}.mark{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--g);font-size:1.2rem}.official{margin-left:auto;padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:white;font-size:.76rem;font-weight:700}.hero{padding:72px 0 48px}.eyebrow{display:flex;align-items:center;gap:9px;color:#147b36;font:800 .72rem Manrope;letter-spacing:.1em}.dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 6px #00d34420}.hero h1{margin:18px 0 10px;font:800 clamp(2.8rem,7vw,6.2rem)/.95 Manrope;letter-spacing:-.07em}.hero h1 em{color:var(--g);font-style:normal}.hero-copy{display:flex;justify-content:space-between;align-items:end;gap:30px}.hero p{max-width:590px;margin:12px 0 0;color:#555b57;font-size:.96rem;line-height:1.8}.stamp{text-align:right;color:var(--muted);font-size:.73rem}.stamp strong{display:block;margin-top:4px;color:var(--ink);font:700 1rem Manrope}.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:22px}.search{position:relative;flex:1}.search input{width:100%;height:50px;padding:0 18px;border:1px solid var(--line);border-radius:14px;background:white;outline:none}.search input:focus{border-color:var(--g);box-shadow:0 0 0 3px #00d34417}.refresh{height:50px;padding:0 18px;border:0;border-radius:14px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.refresh:disabled{opacity:.55}.count{color:var(--muted);font:700 .76rem Manrope;white-space:nowrap}.card{overflow:hidden;border:1px solid var(--line);border-radius:22px;background:white}.head,.track{display:grid;grid-template-columns:72px minmax(260px,1.4fr) minmax(150px,.8fr) 90px;align-items:center;gap:18px}.head{min-height:48px;padding:0 24px;border-bottom:1px solid var(--line);color:#8a908c;font-size:.66rem;font-weight:800;letter-spacing:.08em}.track{min-height:88px;padding:10px 24px;border-bottom:1px solid #edf0ed}.track:hover{background:#f8faf8}.rank{font:800 1.5rem Manrope}.song{display:grid;grid-template-columns:58px minmax(0,1fr);align-items:center;gap:15px;min-width:0}.cover{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#e9ece9}.title,.artist,.album{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title{font-size:.91rem;font-weight:700}.artist{margin-top:4px;color:#6f7571;font-size:.75rem}.album{color:#6f7571;font-size:.76rem}.move{text-align:right;font:700 .7rem Manrope;color:#8a908c}.move.up{color:#f04d68}.move.down{color:#4387ec}.status{padding:70px 20px;text-align:center;color:var(--muted)}.status b{display:block;margin-bottom:8px;color:var(--ink)}.spinner{width:28px;height:28px;margin:0 auto 18px;border:3px solid #dfe4e0;border-top-color:var(--g);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}footer{padding:45px 0;color:#747976;font-size:.72rem}.foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:24px}@media(max-width:720px){.wrap{width:calc(100% - 24px)}nav{height:64px}.hero{padding:48px 0 34px}.hero-copy{display:block}.stamp{text-align:left;margin-top:22px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.head{display:none}.card{border-radius:16px}.track{grid-template-columns:42px 1fr auto;gap:9px;padding:10px 12px}.song{grid-template-columns:52px minmax(0,1fr);gap:11px}.cover{width:52px;height:52px}.album{display:none}.rank{font-size:1.05rem}}
</style></head><body><header><nav class="wrap"><a class="brand" href="#"><span class="mark">m</span><span>K-POP YANGON</span></a><a class="official" href="https://www.melon.com/chart/" target="_blank" rel="noopener">멜론에서 보기 ↗</a></nav></header><main class="wrap"><section class="hero"><div class="eyebrow"><span class="dot"></span>HOURLY MUSIC CHART</div><h1>Melon <em>TOP100</em></h1><div class="hero-copy"><p>대한민국 대표 음원 플랫폼 멜론의 TOP100입니다. 매시 정각 발표되는 순위를 한 시간 동안 캐시해 빠르게 보여드립니다.</p><div class="stamp">차트 기준 시각<strong id="chartTime">불러오는 중</strong></div></div></section><section aria-label="멜론 TOP100 차트"><div class="toolbar"><label class="search"><input id="search" type="search" placeholder="곡 또는 아티스트 검색" autocomplete="off"></label><span class="count" id="count">TOP 100</span><button class="refresh" id="refresh">새로고침</button></div><div class="card"><div class="head"><span>RANK</span><span>SONG / ARTIST</span><span>ALBUM</span><span style="text-align:right">CHANGE</span></div><div id="chart"><div class="status"><div class="spinner"></div><b>멜론 차트를 불러오고 있습니다</b>잠시만 기다려 주세요.</div></div></div></section></main><footer><div class="wrap foot"><span>차트 데이터 출처: Melon</span><span>© 2026 K-POP YANGON</span></div></footer><script>
const chart=document.querySelector('#chart'),time=document.querySelector('#chartTime'),count=document.querySelector('#count'),search=document.querySelector('#search'),refresh=document.querySelector('#refresh');let songs=[];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function move(s){if(s.status==='new')return['NEW','up'];if(!s.change)return['—',''];return[(s.status==='up'?'▲ ':'▼ ')+s.change,s.status]}function render(){const q=search.value.trim().toLocaleLowerCase('ko'),rows=songs.filter(s=>(s.title+' '+s.artist+' '+s.album).toLocaleLowerCase('ko').includes(q));count.textContent=q?`${rows.length}곡 검색됨`:`TOP ${songs.length}`;chart.innerHTML=rows.length?rows.map(s=>{const m=move(s);return `<article class="track"><span class="rank">${String(s.rank).padStart(2,'0')}</span><span class="song"><img class="cover" src="${esc(s.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></span></span><span class="album">${esc(s.album)}</span><span class="move ${m[1]}">${m[0]}</span></article>`}).join(''):'<div class="status"><b>검색 결과가 없습니다</b>다른 검색어를 입력해 보세요.</div>'}async function load(force=false){refresh.disabled=true;refresh.textContent='불러오는 중';try{const r=await fetch('/api/chart'+(force?'?refresh=1':'')),data=await r.json();if(!r.ok||!data.songs?.length)throw Error(data.error||'차트 데이터가 없습니다.');songs=data.songs;time.textContent=data.chartTime||'최신 차트';render()}catch(e){chart.innerHTML=`<div class="status"><b>차트를 불러오지 못했습니다</b>${esc(e.message)} 잠시 후 다시 시도해 주세요.</div>`}finally{refresh.disabled=false;refresh.textContent='새로고침'}}search.addEventListener('input',render);refresh.addEventListener('click',()=>load(true));load();
</script></body></html>
