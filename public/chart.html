<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0910"><title>Melon TOP100 | K-POP YANGON</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#0a0910;--paper:#f6f4f1;--green:#00d344;--line:#34313d;--muted:#9995a2;--yellow:#e9ff70}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:white;font-family:"Noto Sans KR",sans-serif}.wrap{width:min(1120px,calc(100% - 40px));margin:auto}a{color:inherit;text-decoration:none}button{font:inherit}.header{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);background:#0a0910e8;backdrop-filter:blur(15px)}nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:800 1rem Manrope}.back{padding:9px 15px;border:1px solid var(--line);border-radius:999px;color:#ccc8d1;font-size:.76rem}.hero{padding:72px 0 38px}.kicker{color:var(--green);font:800 .72rem Manrope;letter-spacing:.12em}.hero h1{margin:13px 0 14px;font:800 clamp(2.7rem,7vw,5.5rem)/1 Manrope;letter-spacing:-.06em}.hero p{margin:0;color:var(--muted);font-size:.85rem}.tools{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:18px}.time{color:var(--muted);font-size:.75rem}.refresh{padding:10px 16px;border:1px solid var(--line);border-radius:999px;background:transparent;color:white;cursor:pointer}.refresh:disabled{opacity:.5}.chart{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}.track{display:grid;grid-template-columns:64px 58px minmax(0,1.2fr) minmax(150px,.8fr) 65px;align-items:center;gap:16px;min-height:82px;border-bottom:1px solid var(--line)}.rank{color:var(--yellow);font:800 1.3rem Manrope}.cover{width:52px;height:52px;border-radius:8px;object-fit:cover;background:#25232c}.title,.artist,.album{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.title{font-size:.87rem;font-weight:700}.artist,.album{margin-top:3px;color:var(--muted);font-size:.72rem}.move{text-align:right;color:#7be0ad;font:700 .68rem Manrope}.move.down{color:#77a7ff}.move.new{color:#ff3d87}.state{padding:70px 20px;text-align:center;color:var(--muted)}.state strong{display:block;margin-bottom:7px;color:white}footer{padding:45px 0;color:var(--muted);font-size:.7rem}@media(max-width:680px){.wrap{width:calc(100% - 24px)}.hero{padding:50px 0 30px}.track{grid-template-columns:40px 48px minmax(0,1fr) 45px;gap:10px}.cover{width:46px;height:46px}.album{display:none}.rank{font-size:1rem}}
</style></head><body><header class="header"><nav class="wrap"><a class="brand" href="/">K-POP YANGON</a><a class="back" href="/">← 홈으로</a></nav></header><main class="wrap"><section class="hero"><div class="kicker">HOURLY MUSIC CHART</div><h1>Melon TOP100</h1><p>멜론 공식 TOP100 · 매시간 업데이트</p></section><div class="tools"><span class="time" id="time">차트를 불러오는 중입니다</span><button class="refresh" id="refresh">새로고침</button></div><ol class="chart" id="chart"><li class="state"><strong>멜론 TOP100을 불러오고 있습니다</strong>잠시만 기다려 주세요.</li></ol></main><footer class="wrap">차트 데이터 출처: Melon</footer><script>
const root=document.querySelector('#chart'),time=document.querySelector('#time'),refresh=document.querySelector('#refresh');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const movement=s=>s.status==='new'?['NEW','new']:s.change?[`${s.status==='up'?'▲':'▼'} ${s.change}`,s.status]:['—',''];async function load(force=false){refresh.disabled=true;try{const response=await fetch('/api/melon-chart'+(force?'?refresh=1':'')),data=await response.json();if(!response.ok||data.songs?.length<90)throw new Error(data.error||'차트 데이터가 부족합니다.');time.textContent=`${data.chartTime||'최신 차트'} 기준 · ${data.songs.length}곡`;root.innerHTML=data.songs.map(s=>{const m=movement(s);return `<li class="track"><span class="rank">${String(s.rank).padStart(2,'0')}</span><img class="cover" src="${esc(s.image)}" alt="" loading="lazy" referrerpolicy="no-referrer"><span><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></span><span class="album">${esc(s.album)}</span><span class="move ${m[1]}">${m[0]}</span></li>`}).join('')}catch(error){root.innerHTML=`<li class="state"><strong>차트를 불러오지 못했습니다</strong>${esc(error.message)}</li>`}finally{refresh.disabled=false}}refresh.addEventListener('click',()=>load(true));load();
</script></body></html>
